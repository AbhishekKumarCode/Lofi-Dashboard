name: Build Control Panel

on:
  push:
    branches: [ main ]
    paths:
      - 'control-panel/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: control-panel/package.json

      - name: Install dependencies
        working-directory: control-panel
        run: npm install

      - name: Build portable exe
        working-directory: control-panel
        run: npm run dist

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: LofiControlPanel-Windows
          path: control-panel/dist/*.exe
          retention-days: 30
