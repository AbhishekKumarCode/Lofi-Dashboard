<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src http://localhost:3000 http://192.168.1.13:3000; img-src 'self' http://localhost:3000 data:"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#080610;color:#ede8f5;font-family:"Segoe UI",sans-serif;font-size:13px;user-select:none}

/* ── title bar ── */
#titlebar{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 16px;background:rgba(26,16,46,0.98);border-bottom:1px solid rgba(160,130,255,0.15);-webkit-app-region:drag;flex-shrink:0}
#tb-left{display:flex;align-items:center;gap:9px;pointer-events:none}
#tb-dot{width:8px;height:8px;border-radius:50%;background:#a78bfa;box-shadow:0 0 6px #a78bfa88}
#tb-name{font-size:11px;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;color:rgba(210,200,235,0.5)}
#tb-btns{display:flex;gap:6px;-webkit-app-region:no-drag}
.tb-btn{width:28px;height:28px;border-radius:6px;border:none;background:none;cursor:pointer;color:rgba(210,200,235,0.3);font-size:14px;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
.tb-btn:hover{background:rgba(167,139,250,0.15);color:#c4b5fd}
#tb-close:hover{background:rgba(249,100,100,0.2);color:#fca5a5}

/* ── layout ── */
#body{display:flex;height:calc(100% - 38px);overflow:hidden}
#left{width:300px;flex-shrink:0;display:flex;flex-direction:column;padding:16px 14px 16px 18px;gap:14px;border-right:1px solid rgba(160,130,255,0.1);overflow-y:auto}
#right{flex:1;min-width:0;display:flex;flex-direction:column;padding:16px 18px 16px 14px;gap:14px;overflow-y:auto}

/* ── cards ── */
.card{background:rgba(26,16,46,0.85);border:1px solid rgba(160,130,255,0.18);border-radius:12px;padding:14px 16px}
.card-title{font-size:8px;font-weight:700;letter-spacing:0.28em;text-transform:uppercase;color:rgba(180,160,230,0.35);margin-bottom:12px}

/* ── status ── */
#srv-row{display:flex;align-items:center;gap:9px;margin-bottom:11px}
#srv-dot{width:9px;height:9px;border-radius:50%;background:rgba(200,180,230,0.18);flex-shrink:0;transition:background .3s,box-shadow .3s}
#srv-dot.running{background:#6ee7b7;box-shadow:0 0 8px #6ee7b766}
#srv-dot.error  {background:#fca5a5;box-shadow:0 0 8px #fca5a566}
#srv-text{font-size:11px;font-weight:600;color:rgba(210,200,235,0.45)}
#srv-text.running{color:#6ee7b7}

/* ── buttons ── */
.brow{display:flex;gap:7px;flex-wrap:wrap}
.btn{border:none;border-radius:8px;padding:7px 14px;cursor:pointer;font-size:10px;font-weight:600;transition:opacity .15s,transform .1s;font-family:inherit;white-space:nowrap;letter-spacing:0.03em}
.btn:active{transform:scale(0.94)}
.btn-p{background:rgba(167,139,250,0.2);border:1px solid rgba(167,139,250,0.38);color:#c4b5fd}
.btn-p:hover{background:rgba(167,139,250,0.3)}
.btn-d{background:rgba(249,168,212,0.08);border:1px solid rgba(249,168,212,0.25);color:rgba(249,168,212,0.65)}
.btn-d:hover{background:rgba(249,168,212,0.16)}
.btn-g{background:rgba(110,231,183,0.1);border:1px solid rgba(110,231,183,0.28);color:#6ee7b7}
.btn-g:hover{background:rgba(110,231,183,0.2)}
.btn-n{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:rgba(210,200,235,0.4)}
.btn-n:hover{background:rgba(255,255,255,0.09);color:rgba(210,200,235,0.7)}

/* ── log ── */
#log{flex:1;min-height:100px;background:rgba(4,2,12,0.92);border:1px solid rgba(160,130,255,0.1);border-radius:8px;padding:9px 11px;overflow-y:auto;font-family:"Cascadia Code","Consolas",monospace;font-size:10px;line-height:1.7;color:rgba(200,185,230,0.45);white-space:pre-wrap;word-break:break-all}
#log .hi{color:#6ee7b7}
#log .er{color:#fca5a5}
.log-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.log-clear{font-size:9px;color:rgba(180,160,230,0.3);cursor:pointer;background:none;border:none;padding:2px 7px;border-radius:4px}
.log-clear:hover{color:rgba(180,160,230,0.65);background:rgba(160,130,255,0.1)}

/* ── theme picker ── */
#theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.theme-swatch{border-radius:12px;padding:11px 10px;cursor:pointer;border:2px solid rgba(255,255,255,0.06);transition:border-color .18s,transform .12s,box-shadow .18s;position:relative;overflow:hidden}
.theme-swatch::before{content:'';position:absolute;inset:0;opacity:0;background:rgba(255,255,255,0.06);transition:opacity .15s}
.theme-swatch:hover::before{opacity:1}
.theme-swatch:hover{transform:scale(1.04)}
.theme-swatch.active{border-color:rgba(255,255,255,0.5);box-shadow:0 0 12px rgba(255,255,255,0.12)}
.sw-dots{display:flex;gap:5px;margin-bottom:7px}
.sw-dot{width:12px;height:12px;border-radius:50%;box-shadow:0 0 6px currentColor}
.sw-name{font-size:8.5px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.7)}

/* ── wallpaper picker ── */
#wall-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}
.wall-thumb{border-radius:8px;aspect-ratio:16/9;background-size:cover;background-position:center;cursor:pointer;border:2px solid transparent;transition:border-color .18s,transform .12s;position:relative;overflow:hidden}
.wall-thumb:hover{transform:scale(1.04)}
.wall-thumb.active{border-color:rgba(255,255,255,0.6)}
.wall-thumb::after{content:attr(data-label);position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,0.75));color:#fff;font-size:7.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:8px 5px 4px;text-align:center}
.wall-none{background:rgba(8,4,18,0.9);border:1px dashed rgba(160,130,255,0.25);display:flex;align-items:center;justify-content:center;font-size:10px;color:rgba(180,160,230,0.4)}
.custom-row{display:flex;gap:7px;align-items:center}
input[type=text]{flex:1;background:rgba(8,4,18,0.8);border:1px solid rgba(160,130,255,0.2);border-radius:7px;padding:6px 10px;color:#ede8f5;font-size:11px;font-family:inherit;outline:none;transition:border-color .2s}
input:focus{border-color:rgba(167,139,250,0.5)}

/* ── feedback toast ── */
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:rgba(26,16,46,0.97);border:1px solid rgba(110,231,183,0.3);color:#6ee7b7;font-size:10.5px;font-weight:600;padding:7px 18px;border-radius:20px;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap}
#toast.show{opacity:1}

/* scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(167,139,250,0.22);border-radius:4px}
</style>
</head>
<body>

<div id="titlebar">
  <div id="tb-left"><div id="tb-dot"></div><span id="tb-name">lofi control panel</span></div>
  <div id="tb-btns">
    <button class="tb-btn" onclick="api.minimize()">&#8211;</button>
    <button class="tb-btn" id="tb-close" onclick="api.close()">&#10005;</button>
  </div>
</div>

<div id="body">

  <!-- LEFT: server control + log -->
  <div id="left">
    <div class="card">
      <div class="card-title">server</div>
      <div id="srv-row"><div id="srv-dot"></div><span id="srv-text">stopped</span></div>
      <div class="brow">
        <button class="btn btn-p" onclick="api.startServer()">▶ start</button>
        <button class="btn btn-d" onclick="api.stopServer()">■ stop</button>
        <button class="btn btn-n" onclick="api.restartServer()">↺ restart</button>
      </div>
      <div class="brow" style="margin-top:7px">
        <button class="btn btn-g" onclick="api.openDashboard()">↗ open dashboard</button>
      </div>
    </div>

    <div class="card" style="flex:1;min-height:0;display:flex;flex-direction:column">
      <div class="log-hdr">
        <div class="card-title" style="margin:0">log</div>
        <button class="log-clear" onclick="clearLog()">clear</button>
      </div>
      <div id="log"><span class="hi">lofi control panel ready.</span>&#10;</div>
    </div>
  </div>

  <!-- RIGHT: themes + wallpaper -->
  <div id="right">

    <!-- THEMES -->
    <div class="card">
      <div class="card-title">theme</div>
      <div id="theme-grid">
        <div class="theme-swatch active" id="sw-lofi" data-theme="lofi"
          style="background:linear-gradient(145deg,rgba(167,139,250,0.45) 0%,rgba(249,168,212,0.25) 45%,rgba(8,6,16,0.95) 100%)"
          onclick="setTheme('lofi')">
          <div class="sw-dots">
            <div class="sw-dot" style="background:#a78bfa;color:#a78bfa"></div>
            <div class="sw-dot" style="background:#f9a8d4;color:#f9a8d4"></div>
            <div class="sw-dot" style="background:#6ee7b7;color:#6ee7b7"></div>
          </div>
          <div class="sw-name">lofi</div>
        </div>
        <div class="theme-swatch" id="sw-ocean" data-theme="ocean"
          style="background:linear-gradient(145deg,rgba(96,165,250,0.45) 0%,rgba(165,180,252,0.25) 45%,rgba(3,13,24,0.95) 100%)"
          onclick="setTheme('ocean')">
          <div class="sw-dots">
            <div class="sw-dot" style="background:#60a5fa;color:#60a5fa"></div>
            <div class="sw-dot" style="background:#a5b4fc;color:#a5b4fc"></div>
            <div class="sw-dot" style="background:#34d399;color:#34d399"></div>
          </div>
          <div class="sw-name">ocean</div>
        </div>
        <div class="theme-swatch" id="sw-forest" data-theme="forest"
          style="background:linear-gradient(145deg,rgba(74,222,128,0.45) 0%,rgba(110,231,183,0.25) 45%,rgba(3,12,5,0.95) 100%)"
          onclick="setTheme('forest')">
          <div class="sw-dots">
            <div class="sw-dot" style="background:#4ade80;color:#4ade80"></div>
            <div class="sw-dot" style="background:#6ee7b7;color:#6ee7b7"></div>
            <div class="sw-dot" style="background:#a78bfa;color:#a78bfa"></div>
          </div>
          <div class="sw-name">forest</div>
        </div>
        <div class="theme-swatch" id="sw-sakura" data-theme="sakura"
          style="background:linear-gradient(145deg,rgba(249,168,212,0.45) 0%,rgba(253,164,175,0.25) 45%,rgba(18,5,8,0.95) 100%)"
          onclick="setTheme('sakura')">
          <div class="sw-dots">
            <div class="sw-dot" style="background:#f9a8d4;color:#f9a8d4"></div>
            <div class="sw-dot" style="background:#fda4af;color:#fda4af"></div>
            <div class="sw-dot" style="background:#fbbf24;color:#fbbf24"></div>
          </div>
          <div class="sw-name">sakura</div>
        </div>
        <div class="theme-swatch" id="sw-ember" data-theme="ember"
          style="background:linear-gradient(145deg,rgba(252,211,77,0.45) 0%,rgba(251,146,60,0.3) 45%,rgba(14,6,0,0.95) 100%)"
          onclick="setTheme('ember')">
          <div class="sw-dots">
            <div class="sw-dot" style="background:#fcd34d;color:#fcd34d"></div>
            <div class="sw-dot" style="background:#fb923c;color:#fb923c"></div>
            <div class="sw-dot" style="background:#6ee7b7;color:#6ee7b7"></div>
          </div>
          <div class="sw-name">ember</div>
        </div>
        <div class="theme-swatch" id="sw-mono" data-theme="mono"
          style="background:linear-gradient(145deg,rgba(212,212,212,0.35) 0%,rgba(115,115,115,0.2) 45%,rgba(8,8,8,0.95) 100%)"
          onclick="setTheme('mono')">
          <div class="sw-dots">
            <div class="sw-dot" style="background:#d4d4d4;color:#d4d4d4"></div>
            <div class="sw-dot" style="background:#a3a3a3;color:#a3a3a3"></div>
            <div class="sw-dot" style="background:#737373;color:#737373"></div>
          </div>
          <div class="sw-name">mono</div>
        </div>
      </div>
    </div>

    <!-- WALLPAPER -->
    <div class="card">
      <div class="card-title">wallpaper</div>
      <div id="wall-grid">
        <div class="wall-thumb active" id="wp-default" data-wp="default" data-label="lofi"   onclick="setWallpaper('default')"></div>
        <div class="wall-thumb"        id="wp-rain"    data-wp="rain"    data-label="rain"   onclick="setWallpaper('rain')"></div>
        <div class="wall-thumb"        id="wp-cafe"    data-wp="cafe"    data-label="café"   onclick="setWallpaper('cafe')"></div>
        <div class="wall-thumb"        id="wp-city"    data-wp="city"    data-label="city"   onclick="setWallpaper('city')"></div>
        <div class="wall-thumb"        id="wp-forest"  data-wp="forest"  data-label="forest" onclick="setWallpaper('forest')"></div>
        <div class="wall-thumb wall-none" id="wp-none" data-wp="none"   data-label="none"   onclick="setWallpaper('none')">✕</div>
      </div>
      <div class="custom-row">
        <input type="text" id="custom-url" placeholder="custom image URL…"/>
        <button class="btn btn-p" onclick="setCustomWallpaper()">apply</button>
      </div>
    </div>

  </div>
</div>

<div id="toast"></div>

<script>
var SERVER = 'http://localhost:3000';
var currentTheme = 'lofi';
var currentWall  = 'default';

// ── events from main process ──────────────────────────────────
api.on('status', function(s) {
  var dot  = document.getElementById('srv-dot');
  var text = document.getElementById('srv-text');
  dot.className  = s;
  text.className = s;
  text.textContent = s === 'running' ? '● running on :3000' : s === 'error' ? '⚠ error — check log' : '○ stopped';

  if (s === 'running') {
    // Load wallpaper thumbnails via local proxy (avoids CSP/internet issues)
    var ids = ['default','rain','cafe','city','forest'];
    ids.forEach(function(id) {
      var el = document.getElementById('wp-' + id);
      if (el) el.style.backgroundImage = "url('" + SERVER + "/wallpaper?id=" + id + "')";
    });
  }
});

api.on('log', function(line) {
  var el  = document.getElementById('log');
  var sp  = document.createElement('span');
  if (line.match(/error|Error|err\]/i)) sp.className = 'er';
  else if (line.match(/RUNNING|ready|listening|starting/i)) sp.className = 'hi';
  sp.textContent = line;
  el.appendChild(sp);
  el.scrollTop = el.scrollHeight;
  while (el.children.length > 400) el.removeChild(el.firstChild);
});

function clearLog() { document.getElementById('log').innerHTML = ''; }

// ── settings helpers ──────────────────────────────────────────
function postSettings(data) {
  fetch(SERVER + '/settings', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  }).catch(function() { toast('⚠ server not running'); });
}

function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show';
  clearTimeout(toast._t);
  toast._t = setTimeout(function() { el.className = ''; }, 2200);
}

// ── theme ─────────────────────────────────────────────────────
function setTheme(key) {
  document.querySelectorAll('.theme-swatch').forEach(function(el) { el.classList.remove('active'); });
  var sw = document.getElementById('sw-' + key);
  if (sw) sw.classList.add('active');
  currentTheme = key;
  postSettings({ theme: key });
  toast('theme → ' + key);
}

// ── wallpaper ─────────────────────────────────────────────────
function setWallpaper(id) {
  document.querySelectorAll('.wall-thumb').forEach(function(el) { el.classList.remove('active'); });
  var wp = document.getElementById('wp-' + id);
  if (wp) wp.classList.add('active');
  currentWall = id;
  postSettings({ wallpaper: id, wallpaperUrl: '' });
  toast('wallpaper → ' + id);
}

function setCustomWallpaper() {
  var url = document.getElementById('custom-url').value.trim();
  if (!url) return;
  document.querySelectorAll('.wall-thumb').forEach(function(el) { el.classList.remove('active'); });
  currentWall = 'custom';
  postSettings({ wallpaper: 'custom', wallpaperUrl: url });
  toast('custom wallpaper set');
}
</script>
</body>
</html>
