<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#080610;color:#ede8f5;font-family:"Segoe UI",sans-serif;font-size:13px}

/* ── title bar ── */
#titlebar{
  height:38px;display:flex;align-items:center;justify-content:space-between;
  padding:0 14px 0 16px;
  background:rgba(26,16,46,0.98);
  border-bottom:1px solid rgba(160,130,255,0.15);
  -webkit-app-region:drag;
  flex-shrink:0;
}
#titlebar-left{display:flex;align-items:center;gap:9px;pointer-events:none}
#titlebar-dot{width:8px;height:8px;border-radius:50%;background:#a78bfa;box-shadow:0 0 6px #a78bfa88}
#titlebar-name{font-size:11px;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;color:rgba(210,200,235,0.55)}
#titlebar-btns{display:flex;gap:6px;-webkit-app-region:no-drag}
.tb-btn{width:28px;height:28px;border-radius:6px;border:none;background:none;cursor:pointer;color:rgba(210,200,235,0.35);font-size:15px;display:flex;align-items:center;justify-content:center;transition:background 0.15s,color 0.15s}
.tb-btn:hover{background:rgba(167,139,250,0.15);color:#c4b5fd}
#tb-close:hover{background:rgba(249,100,100,0.2);color:#fca5a5}

/* ── layout ── */
#body{display:flex;height:calc(100% - 38px);overflow:hidden}
#left{flex:1;min-width:0;display:flex;flex-direction:column;padding:18px 16px 18px 20px;gap:16px;overflow-y:auto}
#right{width:270px;flex-shrink:0;display:flex;flex-direction:column;padding:18px 20px 18px 14px;gap:16px;border-left:1px solid rgba(160,130,255,0.1);overflow-y:auto}

/* ── section cards ── */
.section{background:rgba(26,16,46,0.85);border:1px solid rgba(160,130,255,0.18);border-radius:12px;padding:14px 16px}
.section-title{font-size:8.5px;font-weight:700;letter-spacing:0.25em;text-transform:uppercase;color:rgba(180,160,230,0.38);margin-bottom:12px}

/* ── server section ── */
#server-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
#status-dot{width:9px;height:9px;border-radius:50%;background:#6ee7b7;box-shadow:0 0 7px #6ee7b788;flex-shrink:0;transition:background 0.3s,box-shadow 0.3s}
#status-dot.stopped{background:rgba(200,180,230,0.2);box-shadow:none}
#status-dot.error{background:#fca5a5;box-shadow:0 0 7px #fca5a588}
#status-text{font-size:11px;font-weight:600;color:rgba(210,200,235,0.6);flex:1}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:none;border-radius:8px;padding:7px 14px;cursor:pointer;font-size:10.5px;font-weight:600;transition:opacity 0.15s,transform 0.1s;white-space:nowrap}
.btn:active{transform:scale(0.95)}
.btn-primary{background:rgba(167,139,250,0.2);border:1px solid rgba(167,139,250,0.4);color:#c4b5fd}
.btn-primary:hover{background:rgba(167,139,250,0.32)}
.btn-danger{background:rgba(249,168,212,0.1);border:1px solid rgba(249,168,212,0.3);color:rgba(249,168,212,0.7)}
.btn-danger:hover{background:rgba(249,168,212,0.2)}
.btn-mint{background:rgba(110,231,183,0.12);border:1px solid rgba(110,231,183,0.3);color:#6ee7b7}
.btn-mint:hover{background:rgba(110,231,183,0.22)}
.btn-dim{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:rgba(210,200,235,0.4)}
.btn-dim:hover{background:rgba(255,255,255,0.09);color:rgba(210,200,235,0.7)}
.btn-yellow{background:rgba(252,211,77,0.12);border:1px solid rgba(252,211,77,0.3);color:#fcd34d}
.btn-yellow:hover{background:rgba(252,211,77,0.22)}

/* ── log ── */
#log-wrap{flex:1;min-height:0;display:flex;flex-direction:column}
#log{
  flex:1;min-height:120px;max-height:280px;
  background:rgba(8,4,18,0.9);border:1px solid rgba(160,130,255,0.12);border-radius:8px;
  padding:10px 12px;overflow-y:auto;
  font-family:"Cascadia Code","Consolas",monospace;font-size:10.5px;line-height:1.7;
  color:rgba(210,200,235,0.55);white-space:pre-wrap;word-break:break-all;
}
#log .hi{color:#6ee7b7}
#log .err{color:#fca5a5}
.log-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.log-clear{font-size:9px;color:rgba(180,160,230,0.3);cursor:pointer;background:none;border:none;padding:2px 6px;border-radius:4px}
.log-clear:hover{color:rgba(180,160,230,0.6);background:rgba(160,130,255,0.1)}

/* ── apk section ── */
#build-status-row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
#build-dot{width:7px;height:7px;border-radius:50%;background:rgba(200,180,230,0.2);flex-shrink:0}
#build-dot.success{background:#6ee7b7;box-shadow:0 0 6px #6ee7b788}
#build-dot.running{background:#fcd34d;box-shadow:0 0 6px #fcd34d88;animation:pulse 1s infinite}
#build-dot.failure{background:#fca5a5;box-shadow:0 0 6px #fca5a588}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
#build-status-text{font-size:10.5px;color:rgba(210,200,235,0.5);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#build-time{font-size:9px;color:rgba(180,160,230,0.3)}

/* ── settings section ── */
.field-label{font-size:9px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:rgba(180,160,230,0.35);margin-bottom:5px}
input[type=text],input[type=password]{
  width:100%;background:rgba(8,4,18,0.8);border:1px solid rgba(160,130,255,0.2);
  border-radius:7px;padding:7px 10px;color:#ede8f5;font-size:11.5px;font-family:inherit;
  outline:none;transition:border-color 0.2s;
}
input:focus{border-color:rgba(167,139,250,0.5)}
.field{margin-bottom:10px}
.save-row{display:flex;justify-content:flex-end;margin-top:4px}
.toast{display:none;font-size:9.5px;color:#6ee7b7;padding:4px 0;text-align:right}
.toast.show{display:block}

/* ── info pills ── */
.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.info-pill{font-size:9px;padding:2px 9px;border-radius:20px;font-weight:600}
.pill-purple{background:rgba(167,139,250,0.1);border:1px solid rgba(167,139,250,0.2);color:rgba(196,181,253,0.7)}
.pill-pink{background:rgba(249,168,212,0.1);border:1px solid rgba(249,168,212,0.2);color:rgba(249,168,212,0.7)}

/* scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(167,139,250,0.25);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(167,139,250,0.45)}
</style>
</head>
<body>

<!-- TITLE BAR -->
<div id="titlebar">
  <div id="titlebar-left">
    <div id="titlebar-dot"></div>
    <span id="titlebar-name">lofi control panel</span>
  </div>
  <div id="titlebar-btns">
    <button class="tb-btn" onclick="api.minimize()" title="Minimise">&#8211;</button>
    <button class="tb-btn" id="tb-close" onclick="api.close()" title="Close">&#10005;</button>
  </div>
</div>

<!-- BODY -->
<div id="body">

  <!-- LEFT: server + log -->
  <div id="left">

    <div class="section">
      <div class="section-title">server</div>
      <div id="server-row">
        <div id="status-dot" class="stopped"></div>
        <span id="status-text">stopped</span>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="api.startServer()">▶ start</button>
        <button class="btn btn-danger"  onclick="api.stopServer()">■ stop</button>
        <button class="btn btn-dim"     onclick="api.restartServer()">↺ restart</button>
        <button class="btn btn-mint"    onclick="api.openDashboard()">↗ open dashboard</button>
      </div>
      <div class="pill-row">
        <span class="info-pill pill-purple">192.168.1.13:3000</span>
        <span class="info-pill pill-pink">Last.fm · Abhishek-29481</span>
      </div>
    </div>

    <div class="section" style="flex:1;min-height:0;display:flex;flex-direction:column">
      <div class="log-header">
        <div class="section-title" style="margin-bottom:0">server log</div>
        <button class="log-clear" onclick="clearLog()">clear</button>
      </div>
      <div id="log-wrap">
        <div id="log"><span class="hi">lofi control panel ready.</span>&#10;</div>
      </div>
    </div>

  </div>

  <!-- RIGHT: APK + settings -->
  <div id="right">

    <div class="section">
      <div class="section-title">apk build</div>
      <div id="build-status-row">
        <div id="build-dot"></div>
        <span id="build-status-text">—</span>
      </div>
      <div id="build-time"></div>
      <div class="btn-row" style="margin-top:10px">
        <button class="btn btn-yellow" onclick="triggerBuild()">⚙ rebuild apk</button>
        <button class="btn btn-dim"    onclick="refreshBuildStatus()">↻ refresh</button>
      </div>
      <div class="btn-row" style="margin-top:8px">
        <button class="btn btn-mint"   onclick="downloadApk()" id="dl-btn" disabled>↓ download apk</button>
        <button class="btn btn-dim"    onclick="openActions()">↗ actions</button>
      </div>
      <div id="build-msg" style="font-size:9.5px;color:rgba(180,160,230,0.4);margin-top:8px"></div>
    </div>

    <div class="section" style="flex:1">
      <div class="section-title">settings</div>
      <div class="field">
        <div class="field-label">github token (PAT)</div>
        <input type="password" id="token-input" placeholder="ghp_xxxxxxxxxxxx" autocomplete="off"/>
      </div>
      <div class="field">
        <div class="field-label">server.js path (optional)</div>
        <input type="text" id="path-input" placeholder="auto-detect"/>
      </div>
      <div class="save-row">
        <button class="btn btn-primary" onclick="saveSettings()">save</button>
      </div>
      <div class="toast" id="save-toast">✓ saved</div>

      <div style="margin-top:14px;padding-top:12px;border-top:1px solid rgba(160,130,255,0.1)">
        <div class="section-title" style="margin-bottom:6px">about</div>
        <div style="font-size:9.5px;color:rgba(180,160,230,0.35);line-height:1.7">
          lofi dashboard · github.com/<br>AbhishekKumarCode/Lofi-Dashboard<br>
          server auto-starts on open
        </div>
      </div>
    </div>

  </div>
</div>

<script>
var token   = '';
var lastRun = null;

// ── receive events from main ──────────────────────────────────
api.on('status', function(s) {
  var dot  = document.getElementById('status-dot');
  var text = document.getElementById('status-text');
  dot.className  = s;           // 'running' | 'stopped' | 'error'
  text.textContent = s === 'running' ? '● running' : s === 'error' ? '⚠ error — check settings' : '○ stopped';
  text.style.color = s === 'running' ? '#6ee7b7' : s === 'error' ? '#fca5a5' : 'rgba(210,200,235,0.45)';
});

api.on('log', function(line) {
  var el  = document.getElementById('log');
  var div = document.createElement('span');
  if (line.includes('[err]') || line.includes('Error') || line.includes('error')) div.className = 'err';
  else if (line.includes('RUNNING') || line.includes('ready') || line.includes('listening')) div.className = 'hi';
  div.textContent = line;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
  // keep log from growing forever
  while (el.children.length > 300) el.removeChild(el.firstChild);
});

api.on('config-loaded', function(cfg) {
  token = cfg.token || '';
  document.getElementById('token-input').value = token;
  document.getElementById('path-input').value  = cfg.serverPath || '';
  if (token) refreshBuildStatus();
});

// ── log helpers ───────────────────────────────────────────────
function clearLog() {
  document.getElementById('log').innerHTML = '';
}

// ── settings ──────────────────────────────────────────────────
function saveSettings() {
  token = document.getElementById('token-input').value.trim();
  var p = document.getElementById('path-input').value.trim();
  api.saveConfig({ token: token, serverPath: p });
  var t = document.getElementById('save-toast');
  t.className = 'toast show';
  setTimeout(function() { t.className = 'toast'; }, 2000);
  if (token) refreshBuildStatus();
}

// ── APK build ─────────────────────────────────────────────────
function triggerBuild() {
  if (!token) { setBuildMsg('⚠ save a GitHub token first'); return; }
  setBuildMsg('triggering build…');
  api.triggerBuild(token).then(function(r) {
    if (r.ok) {
      setBuildMsg('✓ build queued — check Actions tab');
      setRunStatus({ status: 'queued', conclusion: null });
      setTimeout(refreshBuildStatus, 4000);
    } else {
      setBuildMsg('✗ failed (HTTP ' + r.status + ') — check token has workflow scope');
    }
  });
}

function refreshBuildStatus() {
  if (!token) return;
  api.getLatestRun(token).then(function(run) {
    if (!run) { setBuildStatus('—', null, null); return; }
    lastRun = run;
    setRunStatus(run);
    // auto-refresh while running
    if (run.status === 'in_progress' || run.status === 'queued') {
      setTimeout(refreshBuildStatus, 8000);
    }
  });
}

function setRunStatus(run) {
  var dot  = document.getElementById('build-dot');
  var text = document.getElementById('build-status-text');
  var time = document.getElementById('build-time');
  var dl   = document.getElementById('dl-btn');

  dot.className = '';
  if (run.status === 'completed') {
    dot.className = run.conclusion === 'success' ? 'success' : 'failure';
    text.textContent = run.conclusion === 'success' ? '✓ completed' : '✗ ' + (run.conclusion || 'failed');
  } else {
    dot.className = 'running';
    text.textContent = run.status === 'queued' ? '⏳ queued…' : '⟳ building…';
  }

  if (run.updatedAt) {
    time.textContent = 'updated ' + timeAgo(run.updatedAt);
  }

  dl.disabled = !(run.status === 'completed' && run.conclusion === 'success');
}

function setBuildStatus(text, dotClass, timeText) {
  document.getElementById('build-status-text').textContent = text;
  document.getElementById('build-dot').className = dotClass || '';
  document.getElementById('build-time').textContent = timeText || '';
}

function setBuildMsg(msg) {
  document.getElementById('build-msg').textContent = msg;
  setTimeout(function() { document.getElementById('build-msg').textContent = ''; }, 5000);
}

function downloadApk() {
  if (!lastRun) return;
  api.getApkUrl(token, lastRun.id).then(function(r) {
    if (!r) { setBuildMsg('⚠ no artifact found'); return; }
    // GitHub artifact download requires auth — open Actions page instead
    setBuildMsg('↗ opening Actions — click the artifact to download');
    api.openUrl(lastRun.url);
  });
}

function openActions() {
  api.openUrl('https://github.com/AbhishekKumarCode/Lofi-Dashboard/actions');
}

// ── time helper ───────────────────────────────────────────────
function timeAgo(iso) {
  var diff = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (diff < 60)  return diff + 's ago';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  return Math.floor(diff / 3600) + 'h ago';
}
</script>
</body>
</html>
